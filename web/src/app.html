<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<script>
			// Pick the theme before first paint so there's no flash of the wrong colours.
			(function () {
				try {
					var t = localStorage.getItem('krantenwijk-theme');
					if (t !== 'ochtend' && t !== 'avond') {
						t = matchMedia('(prefers-color-scheme: light)').matches ? 'ochtend' : 'avond';
					}
					document.documentElement.setAttribute('data-theme', t);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'ochtend');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
