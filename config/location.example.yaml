# Copy to location.yaml (gitignored) and fill in your own town.
# All demo material uses Amsterdam; nothing here is required to run the web
# app (it derives its view from the uploaded points), but the CLI and synth
# generator read it.

city: Amsterdam

# Map center / default view anchor.
center:
  lat: 52.3728
  lon: 4.8936

# Bounding box that generated/accepted points should fall inside.
bbox:
  min_lon: 4.76
  min_lat: 52.29
  max_lon: 5.02
  max_lat: 52.42

# Shared start/end anchor for routes ("home" in the old workflow).
depot:
  lat: 52.3676
  lon: 4.9041
